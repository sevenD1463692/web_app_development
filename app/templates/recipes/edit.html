{% extends "base.html" %}

{% block title %}{{ 'Edit Recipe' if recipe else 'New Recipe' }} - MyLife{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <h2 class="mb-4 fw-bold text-center text-primary">{{ 'Edit Recipe' if recipe else 'Create New Recipe' }}</h2>
            <form action="{{ url_for('recipes.save_recipe') }}" method="POST">
                {% if recipe %}
                    <input type="hidden" name="id" value="{{ recipe.id }}">
                {% endif %}
                
                <div class="mb-4">
                    <label for="title" class="form-label fw-bold">Recipe Title</label>
                    <input type="text" name="title" class="form-control form-control-lg" id="title" value="{{ recipe.title if recipe }}" placeholder="e.g., Homemade Margherita Pizza" required>
                </div>
                
                <div class="mb-4">
                    <label for="tags" class="form-label fw-bold">Tags</label>
                    <input type="text" name="tags" class="form-control" id="tags" value="{{ recipe.tags if recipe }}" placeholder="e.g., Italian, Dinner, Quick">
                    <div class="form-text">Separate tags with commas.</div>
                </div>
                
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="ingredients" class="form-label fw-bold">Ingredients</label>
                        <textarea name="ingredients" class="form-control" id="ingredients" rows="10" placeholder="List your ingredients here...">{{ recipe.ingredients if recipe }}</textarea>
                    </div>
                    <div class="col-md-6">
                        <label for="steps" class="form-label fw-bold">Preparation Steps</label>
                        <textarea name="steps" class="form-control" id="steps" rows="10" placeholder="Describe the cooking process...">{{ recipe.steps if recipe }}</textarea>
                    </div>
                </div>
                
                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('recipes.index') }}" class="btn btn-light px-4">Discard Changes</a>
                    <button type="submit" class="btn btn-primary px-5 btn-lg">Save to Collection</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
