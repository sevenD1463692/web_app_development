{% extends "base.html" %}

{% block title %}Edit Task - MyLife{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h2 class="mb-4">Edit Task</h2>
            <form action="{{ url_for('tasks.update_task', id=task.id) }}" method="POST">
                <div class="mb-3">
                    <label for="title" class="form-label">Task Title</label>
                    <input type="text" name="title" class="form-control" id="title" value="{{ task.title }}" required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea name="description" class="form-control" id="description" rows="5">{{ task.description }}</textarea>
                </div>
                <div class="mb-3">
                    <label for="due_date" class="form-label">Due Date</label>
                    <input type="date" name="due_date" class="form-control" id="due_date" value="{{ task.due_date.strftime('%Y-%m-%d') if task.due_date }}">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" name="is_completed" class="form-check-input" id="is_completed" {{ 'checked' if task.is_completed }}>
                    <label class="form-check-label" for="is_completed">Completed</label>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('tasks.index') }}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
