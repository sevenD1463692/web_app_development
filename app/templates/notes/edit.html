{% extends "base.html" %}

{% block title %}{{ 'Edit Note' if note else 'New Note' }} - MyLife{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <h2 class="mb-4">{{ 'Edit Note' if note else 'Capture New Note' }}</h2>
            <form action="{{ url_for('notes.save_note') }}" method="POST">
                {% if note %}
                    <input type="hidden" name="id" value="{{ note.id }}">
                {% endif %}
                
                <div class="mb-3">
                    <label for="book_title" class="form-label">Book Title</label>
                    <input type="text" name="book_title" class="form-control" id="book_title" value="{{ note.book_title if note }}" required>
                </div>
                
                <div class="mb-3">
                    <label for="chapter" class="form-label">Chapter / Section</label>
                    <input type="text" name="chapter" class="form-control" id="chapter" value="{{ note.chapter if note }}">
                </div>
                
                <div class="mb-3">
                    <label for="content" class="form-label">Note Content</label>
                    <textarea name="content" class="form-control" id="content" rows="12" placeholder="Write your thoughts here...">{{ note.content if note }}</textarea>
                </div>
                
                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('notes.index') }}" class="btn btn-light">Back to Notes</a>
                    <button type="submit" class="btn btn-primary px-4">Save Note</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
